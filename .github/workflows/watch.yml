name: watch

# Runs on GitHub's runners, NOT in a Claude sandbox - see README "Where this runs".
# Cron floor on Actions is 5 minutes and scheduled runs are commonly delayed
# under load, so treat the interval as approximate.
#
# Minutes budget (GitHub Free, private repo: 2,000/month). Measured 2026-09-18:
# a watch run costs ~1.1 min, and every-15-minutes alone projected to 1,650.
# With Workday's hot tenants added, this is every 30 min over 11-23 UTC = 26
# runs/day (~40 min), plus the daily workday-sweep (~7), digest, reseed and
# resume runs. Recount before adding hours or jobs.
# Two sweeps. The code repo is public (2026-09-24), so runner minutes are free
# and the sweeps are back to the pace that catches a posting first:
#   every 5 min, 06:00-21:00 ET    the companies he follows, about a minute
#   :07 every hour, all day        all 1,128 boards, about three minutes
# Five minutes is GitHub's floor, and scheduled runs are commonly late under
# load, so treat it as "within about ten minutes" rather than a promise.
# "Check now" in the app starts one whenever he wants it sooner.
on:
  schedule:
    - cron: "*/5 10-23,0-1 * * *"
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      targets:
        description: "Only target companies and Amazon (fast)"
        type: boolean
        default: false
      test_alert:
        description: "Fail the Notify step on purpose, to check the alert email arrives"
        type: boolean
        default: false
      backlog_tiers:
        description: "Also queue all current matches in these tiers for resumes (e.g. '1')"
        default: ""
      backlog_hours:
        description: "Also queue all current matches posted within this many hours (e.g. '24')"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: jobbot-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # His criteria, targets, profile, answers, resumes and jobbot's state live
      # in a private repo, so this one can be public. Without DATA_REPO set,
      # everything is read from this checkout as before.
      - name: Get his things
        if: vars.DATA_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: private
      - name: Point jobbot at them
        if: vars.DATA_REPO != ''
        run: |
          if [ ! -f private/criteria.yaml ]; then
            echo "::error::DATA_TOKEN cannot read ${{ vars.DATA_REPO }}. It needs contents and issues"                  "read/write on that repository, with the new account as the resource owner."
            exit 1
          fi
          echo "JOBBOT_PRIVATE=$GITHUB_WORKSPACE/private" >> "$GITHUB_ENV"
          echo "JOBBOT_REPO=${{ vars.DATA_REPO }}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Poll boards
        run: |
          set -o pipefail
          python -m jobbot.watch watch --json-out data/queue.json ${{ (github.event.schedule == '*/5 10-23,0-1 * * *' || inputs.targets) && '--targets' || '' }}             ${{ inputs.backlog_tiers && format('--backlog-tiers {0}', inputs.backlog_tiers) || '' }}             ${{ inputs.backlog_hours && format('--backlog-hours {0}', inputs.backlog_hours) || '' }} | tee run.log
      - name: Commit state
        run: |
          git config user.name  "jobbot"
          git config user.email "jobbot@users.noreply.github.com"
          python -m jobbot.gitsync "watch: $(date -u +%Y-%m-%dT%H:%MZ)"             data/seen.json data/registry.json data/queue.json data/pending.json
      - uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run.log
      # What he tapped while this was running, so a request made a minute ago
      # starts its resume now rather than half an hour from now.
      - name: Take his requests
        env:
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python -m jobbot.appsync pull

      # Only for resumes he has asked for: `resumes.on_request` in criteria.yaml
      # means open-count is what he tapped Apply on, not everything found.
      - name: Start requested resumes
        env:
          # Starting a run is done in the repo the workflows live in.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_CLAUDE" != "true" ]; then echo "CLAUDE_CODE_OAUTH_TOKEN not set - skipping"; exit 0; fi
          open=$(python -m jobbot.tailor status --open-count)
          running=$(gh run list -w resume.yml --json status --jq '[.[] | select(.status != "completed")] | length')
          echo "open postings: $open, resume runs active: $running"
          if [ "$open" != "0" ] && [ "$running" = "0" ]; then gh workflow run resume.yml; fi
      # Postings whose eligibility is a sentence rather than a phrase - "U.S.
      # Citizenship, Lawful Permanent Residency, or Refugee/Asylee Status
      # Required", "enrolled in an MS or PhD program". Started only when there
      # are some, because most sweeps have none.
      - name: Screen the ones the rules cannot judge
        id: screen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_CLAUDE" != "true" ]; then echo "no Claude token - skipping"; exit 0; fi
          python -m jobbot.screen plan --limit 25
          n=$(python -c "import json,sys;from jobbot import screen;print(len(screen._load(screen.ASK, [])))")
          running=$(gh run list -w screen.yml --json status --jq '[.[] | select(.status != "completed")] | length')
          echo "to screen: $n, screen runs active: $running"
          if [ "$n" != "0" ] && [ "$running" = "0" ]; then gh workflow run screen.yml; fi

      # Last on purpose: exits nonzero on a tier-1/2 match so GitHub notifies,
      # after state is already committed.
      - name: Notify
        run: python -m jobbot.notify data/queue.json ${{ inputs.test_alert && '--test' || '' }}

      # Each sweep books the next one.
      #
      # GitHub's schedule is best-effort: */5 came at gaps of 3, 19, 14, 16, 11,
      # 6, 22 and 17 minutes on 2026-09-25. A run that starts its own successor
      # keeps the interval honest, and because a sweep takes a couple of minutes
      # the chain paces itself without sleeping or burning a runner on nothing.
      #
      # The workflow's own GITHUB_TOKEN may start runs, which the app's token may
      # not - so this works whatever the app's token is allowed to do. The
      # schedule above is the failsafe: if a run ever dies before this step, the
      # next scheduled one starts the chain again.
      - name: Book the next sweep
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hour=$(date -u +%-H)
          # 13:00-01:59 UTC is 9am to 9pm in Toronto, when companies post.
          if [ "$hour" -lt 13 ] && [ "$hour" -gt 1 ]; then
            echo "outside his hours - the schedule has it"; exit 0
          fi
          waiting=$(gh run list -w watch.yml --json status \
            --jq '[.[] | select(.status == "queued" or .status == "waiting")] | length')
          if [ "$waiting" != "0" ]; then echo "one is already waiting its turn"; exit 0; fi
          gh workflow run watch.yml -f targets=true && echo "next sweep booked"

      # The app is what he looks at: tell it what happened, and pick up
      # anything he tapped while this was running.
      - name: Sync the app
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python -m jobbot.appsync push
