name: commands

# Actions the user takes on a job, from the phone app or by commenting on the
# issue: /applied, /rebuild, /stop, /skip, /reopen. (/approve is applying, and
# lives in approve.yml.) Same channel for both, so the app needs no extra
# permissions on his token.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: jobbot-commands
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/') &&
      !startsWith(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # His criteria, targets, profile, answers, resumes and jobbot's state live
      # in a private repo, so this one can be public. Without DATA_REPO set,
      # everything is read from this checkout as before.
      - name: Get his things
        if: vars.DATA_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: private
      - name: Point jobbot at them
        if: vars.DATA_REPO != ''
        run: |
          echo "JOBBOT_PRIVATE=$GITHUB_WORKSPACE/private" >> "$GITHUB_ENV"
          echo "JOBBOT_REPO=${{ vars.DATA_REPO }}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the command
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN || secrets.GITHUB_TOKEN }}
          BODY: ${{ github.event.comment.body }}
        run: |
          cmd=$(printf '%s' "$BODY" | head -1 | tr -d '\r' | awk '{print $1}')
          python -m jobbot.commands "${{ github.event.issue.number }}" "$cmd"
          python -m jobbot.gitsync "command $cmd on #${{ github.event.issue.number }}" \
            data/tailored.json data/approvals.jsonl data/applications.jsonl

      # The app is what he looks at: tell it what happened, and pick up
      # anything he tapped while this was running.
      - name: Sync the app
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python -m jobbot.appsync push
