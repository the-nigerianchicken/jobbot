name: approve

# the user approves a resume from his phone: comment `/approve` on its issue, or add
# the `approved` label. That is his per-job permission to fill in his details,
# accept the agreements listed in the issue, and submit. jobbot.apply fills the
# Greenhouse / Ashby / Lever form and submits. It stops and hands the job back
# (label apply-by-hand, apply link + answers in the issue) on a CAPTCHA
# challenge, a question that needs him, or no confirmation. It never solves or
# evades a CAPTCHA, and never submits the same job twice.
on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Retry applying for this resume issue number"
        required: true
      force:
        description: "Submit again even though an attempt was already logged (risks a duplicate)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: jobbot-approve
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.actor == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'resume-ready') &&
      ((github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/approve')) ||
       (github.event_name == 'issues' && github.event.label.name == 'approved'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # His criteria, targets, profile, answers, resumes and jobbot's state live
      # in a private repo, so this one can be public. Without DATA_REPO set,
      # everything is read from this checkout as before.
      - name: Get his things
        if: vars.DATA_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: private
      - name: Point jobbot at them
        if: vars.DATA_REPO != ''
        run: |
          if [ ! -f private/criteria.yaml ]; then
            echo "::error::DATA_TOKEN cannot read ${{ vars.DATA_REPO }}. It needs contents and issues"                  "read/write on that repository, with the new account as the resource owner."
            exit 1
          fi
          echo "JOBBOT_PRIVATE=$GITHUB_WORKSPACE/private" >> "$GITHUB_ENV"
          echo "JOBBOT_REPO=${{ vars.DATA_REPO }}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Record approval
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "jobbot"
          git config user.email "jobbot@users.noreply.github.com"
          python -m jobbot.tailor approve "${{ github.event.issue.number || inputs.issue }}"
          python -m jobbot.gitsync "approved #${{ github.event.issue.number || inputs.issue }}" data/approvals.jsonl
      - name: Read the form if needed
        id: prep
        run: |
          python -m jobbot.build_profile --source pipeline/profile.yaml
          python -m jobbot.apply "${{ github.event.issue.number || inputs.issue }}" --prepare-only
      - name: Claude token
        if: steps.prep.outputs.drafts != '0'
        env:
          RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          T="$(printf '%s' "$RAW" | tr -d '[:space:]')"
          echo "::add-mask::$T"
          echo "CLAUDE_TOKEN=$T" >> "$GITHUB_ENV"
      - name: Draft missing answers
        if: steps.prep.outputs.drafts != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot],github-actions"
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Edit,Write"
          prompt: |
            In "${{ steps.prep.outputs.folder }}/application.json", every question with
            "how": "draft" and no answer needs an "answer" for the user's job application.
            Use data/profile.json (his facts) and JD.md in the same folder.
            - first person, concise, grounded only in profile.json facts and the JD;
            - select: exactly one string from "options"; multiselect: options joined with "; ";
            - never invent a fact, number, employer, or skill. If the honest answer is no, say no.
            Do not change any other entry or any other file.
      # Anything he edited in the app must be in the folder before the form is
      # filled in - an answer he fixed a minute ago is the one that must be used.
      - name: Take his edits first
        env:
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python -m jobbot.appsync pull
      - name: Apply
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python -m jobbot.apply "${{ github.event.issue.number || inputs.issue }}" ${{ inputs.force && '--force' || '' }}
          python -m jobbot.gitsync "applied #${{ github.event.issue.number || inputs.issue }}" data/applications.jsonl resumes
      # Screenshots also kept on the run itself, in case the commit fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apply-screenshots
          path: resumes/**/apply/*.png
          if-no-files-found: ignore

      # The app is what he looks at: tell it what happened, and pick up
      # anything he tapped while this was running.
      - name: Sync the app
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python -m jobbot.appsync push
